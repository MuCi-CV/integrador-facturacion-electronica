<!DOCTYPE html>
<html>
<head>
    <title>Recuperar Contraseña</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="email"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 14px; }
        .message { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>¿Olvidaste tu contraseña?</h2>
    
    <p>Ingresa tu dirección de email y te enviaremos instrucciones para crear una nueva contraseña.</p>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_email">Email:</label>
            <input type="email" name="email" id="id_email" required>
            {% if form.email.errors %}
                <div class="error">{{ form.email.errors }}</div>
            {% endif %}
        </div>
        
        <button type="submit">Enviar instrucciones</button>
    </form>
    
    <div style="margin-top: 20px;">
        <a href="/admin/">← Volver al login</a>
    </div>
</body>
</html>
